name: Build Ad-Hoc Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the manual build (MAJOR.MINOR.PATCH)
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID_PREFIX: com.brohd
  MACH_SERVICE_NAME: com.brohd.FinderActions.runner

jobs:
  build:
    name: Test and package
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine and validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          semantic_version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH without leading zeroes." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
              echo "Release tag $GITHUB_REF_NAME does not point to a commit on main." >&2
              exit 1
            fi
          else
            version="$MANUAL_VERSION"
            if [[ ! "$version" =~ $semantic_version_pattern ]]; then
              echo "Manual versions must use MAJOR.MINOR.PATCH without leading zeroes." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building Finder Actions $version ($GITHUB_RUN_NUMBER)"

      - name: Show build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinderActions.xcodeproj \
            -scheme FinderActions \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            "BUNDLE_ID_PREFIX=$BUNDLE_ID_PREFIX" \
            "MACH_SERVICE_NAME=$MACH_SERVICE_NAME" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            test

      - name: Build, sign, verify and archive
        run: |
          set -euo pipefail
          scripts/package.sh "$RELEASE_VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/Artifacts"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: finder-actions-release
          path: |
            ${{ runner.temp }}/Artifacts/Finder-Actions.zip
            ${{ runner.temp }}/Artifacts/Finder-Actions.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: finder-actions-release
          path: release-assets

      - name: Verify release checksum
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c Finder-Actions.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          release_note='This build is ad-hoc signed and is not notarized. On first launch, approve it under System Settings > Privacy & Security, then enable the per-user background runner in the dashboard and enable the Finder extension. Protected locations may require Full Disk Access for the embedded Finder extension, and macOS may request privacy permissions again after an update.'
          gh release create "$GITHUB_REF_NAME" \
            'release-assets/Finder-Actions.zip#Finder Actions for macOS (universal, ad-hoc signed)' \
            'release-assets/Finder-Actions.zip.sha256#SHA-256 checksum' \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Finder Actions v$RELEASE_VERSION" \
            --notes "$release_note"
