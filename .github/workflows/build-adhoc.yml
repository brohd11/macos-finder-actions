name: Build Ad-Hoc Smoke Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_ID_PREFIX: com.brohd.adhoc
  APP_GROUP_IDENTIFIER: group.com.brohd.adhoc.FinderActions

jobs:
  build:
    name: Test and package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinderActions.xcodeproj \
            -scheme FinderActions \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            "BUNDLE_ID_PREFIX=$BUNDLE_ID_PREFIX" \
            "APP_GROUP_IDENTIFIER=$APP_GROUP_IDENTIFIER" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            test

      - name: Build unsigned universal app
        run: |
          set -euo pipefail
          xcodebuild \
            -project FinderActions.xcodeproj \
            -scheme FinderActions \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            "BUNDLE_ID_PREFIX=$BUNDLE_ID_PREFIX" \
            "APP_GROUP_IDENTIFIER=$APP_GROUP_IDENTIFIER" \
            ONLY_ACTIVE_ARCH=NO \
            'ARCHS=arm64 x86_64' \
            build

      - name: Stage and identify smoke-test app
        run: |
          set -euo pipefail
          source_app="$RUNNER_TEMP/DerivedData/Build/Products/Release/Finder Actions.app"
          stage="$RUNNER_TEMP/Package"
          app="$stage/Finder Actions Ad Hoc.app"

          mkdir -p "$stage"
          ditto "$source_app" "$app"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Finder Actions Ad Hoc' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Finder Actions Ad Hoc' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Finder Actions Ad Hoc' "$app/Contents/PlugIns/FinderActionsFinderSync.appex/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Finder Actions Ad Hoc' "$app/Contents/PlugIns/FinderActionsFinderSync.appex/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Finder Actions Ad Hoc Runner' "$app/Contents/Library/LoginItems/FinderActionsRunner.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName Finder Actions Ad Hoc Runner' "$app/Contents/Library/LoginItems/FinderActionsRunner.app/Contents/Info.plist"

      - name: Apply ad-hoc signatures
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Package/Finder Actions Ad Hoc.app"
          extension="$app/Contents/PlugIns/FinderActionsFinderSync.appex"
          runner="$app/Contents/Library/LoginItems/FinderActionsRunner.app"
          entitlements="$RUNNER_TEMP/Entitlements"

          mkdir -p "$entitlements"
          cp Resources/Entitlements/App.entitlements "$entitlements/App.entitlements"
          cp Resources/Entitlements/FinderSync.entitlements "$entitlements/FinderSync.entitlements"
          cp Resources/Entitlements/Runner.entitlements "$entitlements/Runner.entitlements"

          for file in "$entitlements/App.entitlements" "$entitlements/FinderSync.entitlements" "$entitlements/Runner.entitlements"; do
            /usr/libexec/PlistBuddy \
              -c "Set :com.apple.security.application-groups:0 $APP_GROUP_IDENTIFIER" \
              "$file"
            plutil -lint "$file"
          done

          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements "$entitlements/Runner.entitlements" "$runner"
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements "$entitlements/FinderSync.entitlements" "$extension"
          codesign --force --sign - --timestamp=none --options runtime \
            --entitlements "$entitlements/App.entitlements" "$app"

      - name: Verify package
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Package/Finder Actions Ad Hoc.app"
          extension="$app/Contents/PlugIns/FinderActionsFinderSync.appex"
          runner="$app/Contents/Library/LoginItems/FinderActionsRunner.app"

          require_universal() {
            local binary="$1"
            local architectures
            architectures="$(lipo -archs "$binary")"
            echo "$binary: $architectures"
            [[ " $architectures " == *' arm64 '* ]]
            [[ " $architectures " == *' x86_64 '* ]]
          }

          require_universal "$app/Contents/MacOS/Finder Actions"
          require_universal "$extension/Contents/MacOS/FinderActionsFinderSync"
          require_universal "$runner/Contents/MacOS/FinderActionsRunner"

          codesign --verify --strict --verbose=2 "$runner"
          codesign --verify --strict --verbose=2 "$extension"
          codesign --verify --deep --strict --verbose=2 "$app"

          echo 'Outer app signature:'
          codesign -d --verbose=4 "$app" 2>&1
          echo 'Outer app entitlements:'
          codesign -d --entitlements :- "$app" 2>&1
          echo 'Finder extension entitlements:'
          codesign -d --entitlements :- "$extension" 2>&1

          echo 'Gatekeeper assessment (rejection is expected for an ad-hoc signature):'
          set +e
          spctl --assess --type execute --verbose=4 "$app"
          gatekeeper_status=$?
          set -e
          echo "spctl exit status: $gatekeeper_status"

      - name: Create ZIP and checksum
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/Artifacts"
          app="$RUNNER_TEMP/Package/Finder Actions Ad Hoc.app"
          archive="$artifact_dir/Finder-Actions-Ad-Hoc.zip"

          mkdir -p "$artifact_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          (
            cd "$artifact_dir"
            shasum -a 256 Finder-Actions-Ad-Hoc.zip > Finder-Actions-Ad-Hoc.zip.sha256
          )

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: finder-actions-adhoc-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Artifacts/Finder-Actions-Ad-Hoc.zip
            ${{ runner.temp }}/Artifacts/Finder-Actions-Ad-Hoc.zip.sha256
          if-no-files-found: error
          retention-days: 7
